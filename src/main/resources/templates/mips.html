<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MipsStepLab</title>
</head>

<body>
    <h1>MipsStepLab</h1>

    <p>
        MIPS命令を1ステップずつ実行しながら、
        レジスタやメモリの変化を確認する学習用デバッガです。
    </p>

    <h2>プログラム入力</h2>

    <form method="post" action="/mips">
        <div>
            <textarea name="programText" rows="8" cols="60" th:text="${programText}"></textarea>
        </div>

        <button type="submit">プログラムを表示</button>
    </form>

    <h2>入力されたプログラム</h2>

    <ol start="0">
        <li th:each="instruction : ${programLines}" th:text="${instruction}">
            addi $t0, $zero, 5
        </li>
    </ol>

    <h2>解析結果</h2>

    <div th:if="${parseMessage != null}">
        <p th:text="${parseMessage}">
            パース結果がここに表示されます。
        </p>
    </div>

    <div th:if="${readyToRun}">
        <p>
            実行準備が完了しました。次のステップで1ステップ実行を追加できます。
        </p>
    </div>

    <h2>現在の段階</h2>
    <p>
        textareaから入力されたMIPS命令をControllerで受け取り、
        行ごとの命令一覧として表示しています。
    </p>
</body>

</html>
