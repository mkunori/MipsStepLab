<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MipsStepLab</title>
</head>

<body>
    <h1>MipsStepLab</h1>

    <p>
        MIPS命令を1ステップずつ実行しながら、
        レジスタやメモリの変化を確認する学習用デバッガです。
    </p>

    <h2>サンプルプログラム</h2>

    <ol start="0">
        <li th:each="instruction : ${sampleProgram}" th:text="${instruction}">
            addi $t0, $zero, 5
        </li>
    </ol>

    <h2>現在の段階</h2>
    <p>
        Spring BootでHTML画面にサンプルプログラムを表示しています。
    </p>
</body>

</html>
